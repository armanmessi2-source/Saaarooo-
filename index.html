<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday, Sarah ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body {
    background: radial-gradient(circle at 50% 35%, #fff9f8 0%, #f7e4e8 100%);
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: #2c1e22;
    margin: 0; padding: 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; text-align: center;
  }
  .card {
    background: white; padding: 30px 20px; border-radius: 20px;
    box-shadow: 0 15px 35px rgba(217,56,90,0.15); max-width: 340px; width: 100%;
  }
  h1 { font-family: 'Playfair Display', serif; font-size: 2.2rem; color: #d9385a; margin-bottom: 10px; }
  p { font-size: 0.95rem; color: #7a666c; line-height: 1.5; margin-bottom: 25px; }
  .btn {
    background: linear-gradient(135deg, #ea5273, #c8284b); color: white;
    border: none; padding: 14px 30px; border-radius: 999px; font-size: 1rem;
    font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block;
    box-shadow: 0 10px 24px rgba(200, 40, 75, 0.32);
  }
  .emoji { font-size: 3rem; margin-bottom: 15px; }
</style>
</head>
<body>

  <div class="card">
    <div class="emoji">👑🤍🎂</div>
    <h1>Happy Birthday, Sarah!</h1>
    <p>Aaj ka din duniya ka sab se pyara din hai, kyunke aaj meri princess ka birthday hai! ✨</p>
    <a href="#wish" class="btn" onclick="alert('Janamdin Mubarak ho Sarah! Tumhari zindagi khushiyon se bhar jaye! 💖')">Open Your Wish ✨</a>
  </div>

</body>
</html>
